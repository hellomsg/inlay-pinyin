name: Build Inlay Preview APK

on:
  push:
    branches:
      - codex/inlay-cloud-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' 'build-tools;36.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Prepare offline Pinyin dependencies
        run: python3 tools/prepare_rime.py

      - name: Build preview APK
        run: |
          if ! bash ./gradlew --no-daemon :app:assemblePreview > "$RUNNER_TEMP/gradle-preview.log" 2>&1; then
            tail -n 150 "$RUNNER_TEMP/gradle-preview.log"
            grep -E 'CMake Error|(^|[[:space:]])(error:|e:)|^> ' "$RUNNER_TEMP/gradle-preview.log" |
              head -n 12 | while IFS= read -r line; do
                printf '::error::%s\n' "${line//%/%25}"
              done
            exit 1
          fi
          tail -n 15 "$RUNNER_TEMP/gradle-preview.log"

      - uses: actions/upload-artifact@v6
        with:
          name: inlay-preview-apk
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test the bundled Pinyin dictionary on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash ./gradlew --no-daemon :app:connectedPreviewAndroidTest
