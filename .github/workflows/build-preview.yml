name: Build Inlay Preview APK

on:
  push:
    branches:
      - codex/inlay-cloud-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Build preview APK
        run: bash ./gradlew --no-daemon :app:assemblePreview

      - uses: actions/upload-artifact@v6
        with:
          name: inlay-preview-apk
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
